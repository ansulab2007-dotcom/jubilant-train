<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Linked List Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .controls { margin-bottom: 20px; }
    .controls input { padding: 5px; margin-right: 5px; }
    .controls button { padding: 5px 10px; margin-right: 5px; }
    .list-container { display: flex; flex-wrap: wrap; gap: 10px; }
    .node {
      border: 1px solid #333;
      padding: 10px;
      min-width: 60px;
      text-align: center;
      background: #f0f0f0;
      position: relative;
    }
    .node::after {
      content: "→";
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
    }
    .node:last-child::after { content: ""; }
    .empty { color: #777; font-style: italic; }
  </style>
</head>
<body>
  <h1>Singly Linked List</h1>

  <div class="controls">
    <input type="number" id="valueInput" placeholder="Enter number" />
    <button onclick="insertAtHead()">Insert</button>
    <button onclick="deleteFirst()">Delete</button>
    <button onclick="search()">Search</button>
    <button onclick="display()">Display</button>
  </div>

  <div>
    <strong>Current List:</strong>
    <div id="listDisplay" class="list-container"></div>
  </div>

  <script>
    
    function Node(data) {
      this.data = data;
      this.next = null;
    }

    let head = null;

    
    function insertAtHead() {
      const val = document.getElementById("valueInput").value;
      if (val === "") return;
      const num = Number(val);

      const newNode = new Node(num);
      newNode.next = head;
      head = newNode;

      document.getElementById("valueInput").value = "";
      display();
    }

    
    function deleteFirst() {
      const val = document.getElementById("valueInput").value;
      if (val === "") return;
      const num = Number(val);

      if (head === null) {
        display();
        return;
      }

      
      if (head.data === num) {
        head = head.next;
        display();
        return;
      }

      let current = head;
      while (current.next !== null) {
        if (current.next.data === num) {
          current.next = current.next.next;
          break;
        }
        current = current.next;
      }

      display();
    }

    
    function search() {
      const val = document.getElementById("valueInput").value;
      if (val === "") return;
      const num = Number(val);

      let current = head;
      let index = 0;
      let found = false;

      while (current !== null) {
        if (current.data === num) {
          found = true;
          break;
        }
        current = current.next;
        index++;
      }

      if (found) {
        alert("Found at position (0-based): " + index);
      } else {
        alert("Not found");
      }
    }

    
    function display() {
      const container = document.getElementById("listDisplay");
      container.innerHTML = "";

      if (head === null) {
        container.innerHTML = '<div class="empty">List is empty</div>';
        return;
      }

      let current = head;
      while (current !== null) {
        const box = document.createElement("div");
        box.className = "node";
        box.textContent = current.data;
        container.appendChild(box);
        current = current.next;
      }
    }

    display();
  </script>
</body>
</html>
